[workspace]
members = [
    "crates/argus-domain",
    "crates/argus-application",
    "crates/argus-infrastructure",
    "crates/argus-runtime",
    "crates/argus-bridge",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "GPL-3.0-only"
publish = false

[workspace.dependencies]
aes = { version = "0.8.4", default-features = false }
fs2 = "0.4.3"
getrandom = { version = "0.4.3", features = ["sys_rng"] }
blake3 = "1.8.2"
chd = { version = "0.3.4", default-features = false, features = ["std", "verify_block_crc"] }
flate2 = { version = "1.1.9", default-features = false, features = ["rust_backend"] }
flutter_rust_bridge = "=2.12.0"
image = { version = "0.25.8", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }
keyring = { version = "4.1.6", features = ["cli", "android-native-keyring-store"] }
keyring-core = "1.0.0"
lzma-rust2 = { version = "0.20.0", default-features = false, features = ["std", "xz"] }
oxiarc-bzip2 = { version = "0.4.1", default-features = false }
oxiarc-lzma = { version = "0.4.1", default-features = false }
ruzstd = { version = "0.9.0", default-features = false, features = ["std"] }
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
serde_json = "1.0.145"
sha1 = { version = "0.10.7", default-features = false }
sha2 = { version = "0.11.0", default-features = false }
tempfile = "3.27.0"
ureq = { version = "3.1.2", default-features = false, features = ["rustls"] }
zeroize = "1.8.2"
sevenz-rust2 = { version = "0.22.0", default-features = false, features = ["bzip2", "deflate", "ppmd", "util"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2"] }

[workspace.lints.rust]
unsafe_code = "deny"
