name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Platform-neutral quality gate
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up just
        uses: extractions/setup-just@v4
        with:
          just-version: 1.58.0

      - name: Set up pinned Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version-file: flutter/.fvmrc
          cache: true
          pub-cache: true

      - name: Install CI FVM prerequisite
        run: |
          dart pub global activate fvm 4.1.2
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Verify ShellCheck prerequisite
        run: shellcheck --version

      - name: Install ripgrep prerequisite
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y ripgrep

      - name: Bootstrap repository
        run: just bootstrap

      - name: Run canonical quality gate
        run: just check

  native-desktop:
    name: Native desktop compile (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pinned Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version-file: flutter/.fvmrc
          cache: true
          pub-cache: true

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          rust_channel="$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$rust_channel" --profile minimal

      - name: Check Rust workspace
        shell: bash
        run: cargo check --manifest-path rust/Cargo.toml --workspace --all-targets --locked

      - name: Resolve Flutter dependencies
        shell: bash
        run: cd flutter && flutter pub get --enforce-lockfile

      - name: Build Rust bridge for macOS
        shell: bash
        if: runner.os == 'macOS'
        run: bash scripts/run_rust.sh cargo build --manifest-path rust/Cargo.toml --package argus-bridge --locked

      - name: Build native Flutter desktop shell
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cd flutter
            flutter build windows --debug
          else
            cd flutter
            flutter build macos --debug
          fi

  provider-windows:
    name: Windows LocalFilesystem provider
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up just
        uses: extractions/setup-just@v4
        with:
          just-version: 1.58.0

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          rust_channel="$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$rust_channel" --profile minimal

      - name: Run real LocalFilesystem provider tests
        shell: bash
        run: just test-local-filesystem-native

  provider-linux:
    name: Linux LocalFilesystem provider
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up just
        uses: extractions/setup-just@v4
        with:
          just-version: 1.58.0

      - name: Install pinned Rust toolchain
        run: |
          rust_channel="$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$rust_channel" --profile minimal

      - name: Run real LocalFilesystem provider tests
        run: just test-local-filesystem-native

  phase-001-native:
    name: Phase 001 native milestone
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up just
        uses: extractions/setup-just@v4
        with:
          just-version: 1.58.0

      - name: Set up pinned Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version-file: flutter/.fvmrc
          cache: true
          pub-cache: true

      - name: Install CI FVM prerequisite
        run: |
          dart pub global activate fvm 4.1.2
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Install ShellCheck prerequisite
        run: brew install shellcheck

      - name: Install ripgrep prerequisite
        run: brew install ripgrep

      - name: Install pinned Rust toolchain
        run: |
          rust_channel="$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$rust_channel" --profile minimal

      - name: Bootstrap repository
        run: just bootstrap

      - name: Phase 001 native milestone
        run: just test-phase-001-native

      - name: Phase 000 native regression
        run: just test-phase-000-native

  android-arm64-package:
    name: Android ARM64 build and package verification
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up just
        uses: extractions/setup-just@v4
        with:
          just-version: 1.58.0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up pinned Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version-file: flutter/.fvmrc
          cache: true
          pub-cache: true

      - name: Install CI FVM prerequisite
        run: |
          dart pub global activate fvm 4.1.2
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Install pinned Rust toolchain
        run: |
          rust_channel="$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$rust_channel" --profile minimal

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '12266719'

      - name: Install the Flutter-pinned Android NDK
        run: |
          flutter_root="${FLUTTER_ROOT:-$(dirname "$(dirname "$(command -v flutter)")")}"
          flutter_ndk_version="$(
            sed -n 's/.*val ndkVersion: String = "\([^"]*\)".*/\1/p' \
              "${flutter_root}/packages/flutter_tools/gradle/src/main/kotlin/FlutterExtension.kt" \
              | head -n 1
          )"
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "ndk;${flutter_ndk_version}"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${flutter_ndk_version}" \
            >> "$GITHUB_ENV"

      - name: Install ripgrep prerequisite
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y ripgrep

      - name: Bootstrap repository
        run: just bootstrap

      - name: Verify Android ARM64 source contract
        run: just check-android-contract

      - name: Build Android ARM64 debug APK
        run: just build-android-debug

      - name: Verify Android ARM64 package
        run: just check-android-package
