[workspace]
members = [
    "crates/argus-domain",
    "crates/argus-application",
    "crates/argus-infrastructure",
    "crates/argus-runtime",
    "crates/argus-bridge",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "GPL-3.0-only"
publish = false

[workspace.dependencies]
getrandom = { version = "0.4.3", features = ["sys_rng"] }
blake3 = "1.8.2"
flutter_rust_bridge = "=2.12.0"
image = { version = "0.25.8", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }
keyring = { version = "4.1.6", features = ["cli"] }
keyring-core = "1.0.0"
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
serde_json = "1.0.145"
sha2 = { version = "0.11.0", default-features = false }
tempfile = "3.27.0"
ureq = { version = "3.1.2", default-features = false, features = ["rustls"] }
zeroize = "1.8.2"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
unsafe_code = "deny"
